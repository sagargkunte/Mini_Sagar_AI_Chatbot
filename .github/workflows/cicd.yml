name: Mini Sagar AI Chatbot CI/CD

on:
  push:
    branches:  
      - master 
  pull_request:
    branches:  
      - master 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mini-sagar-ai-chatbot:latest .

      - name: Publish Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mini-sagar-ai-chatbot:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code on EC2
        uses: actions/checkout@v4

      - name: Login to Docker Hub on EC2
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Create or Update Environment File
        run: |
          rm -f .env
          echo "NODE_ENV=production" >> .env
          echo "PORT=3001" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "OPEN_ROUTER=${{ secrets.OPEN_ROUTER }}" >> .env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
          echo "CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}" >> .env

      - name: Deploy Application Stack via Docker Compose
        run: |
          # FIXED: Using the hyphenated version 'docker-compose' supported by your system v1/v2 binary alias
          docker-compose pull
          
          # Spin up the app and qdrant-db containers together seamlessly
          docker-compose up -d --force-recreate
